<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Pitch Trainer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.top{background:#000;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;font-size:12px;flex-shrink:0;gap:8px}
.status{color:#aaa;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-weight:700;font-size:13px;color:#fff;min-width:80px;text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:#444;flex-shrink:0;transition:all .2s}
.dot.on{background:#4ade80;box-shadow:0 0 8px #4ade80}
.main{flex:1;display:flex;position:relative;overflow:hidden;min-height:0}
.piano{width:48px;background:#1a1a1a;position:relative;overflow:hidden;border-right:1px solid #2a2a2a;flex-shrink:0}
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:#0f0f0f}
canvas{display:block;position:absolute;top:0;left:0}
.bottom{background:#000;padding:10px 12px;display:flex;justify-content:space-around;align-items:center;gap:8px;border-top:1px solid #222;flex-shrink:0}
.btn{background:#2a2a2a;color:#fff;border:none;border-radius:50%;width:48px;height:48px;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s;flex-shrink:0}
.btn:active{transform:scale(.92)}
.btn:disabled{opacity:.3}
.btn.rec{background:#dc2626}
.btn.rec.on{animation:pulse 1s infinite}
.btn.play{background:#16a34a}
.lbl-btn{background:#ff7a1a;color:#000;font-weight:700;font-size:11px;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:center;line-height:1.2}
.lbl-btn:active{transform:scale(.95)}
.lbl-btn.alt{background:#374151;color:#fff}
.file-in{display:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.zoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;z-index:10}
.zoom button{background:rgba(0,0,0,.6);color:#fff;border:1px solid #333;border-radius:6px;width:32px;height:32px;font-size:16px;cursor:pointer}
.cursor-line{position:absolute;top:0;bottom:0;width:1px;background:rgba(34,197,94,.6);pointer-events:none;z-index:5}
</style>
</head>
<body>
<div class="top">
  <div class="dot" id="dot"></div>
  <div class="status" id="status">▶ボタンでマイクを開始</div>
  <div class="note" id="note">--</div>
</div>
<div class="main">
  <div class="piano"><canvas id="pCv"></canvas></div>
  <div class="canvas-wrap">
    <canvas id="vCv"></canvas>
    <div class="zoom">
      <button id="zUp">▲</button>
      <button id="zDn">▼</button>
    </div>
  </div>
</div>
<div class="bottom">
  <label class="lbl-btn alt">MIDI<input class="file-in" type="file" id="midiF" accept=".mid,.midi"></label>
  <button class="btn play" id="playBtn" title="ガイド再生">▶</button>
  <button class="btn rec" id="recBtn" title="録音">●</button>
  <button class="btn" id="stopBtn" title="停止">■</button>
  <button class="btn" id="pbBtn" title="録音再生" disabled>♪</button>
</div>

<script>
// ============ State ============
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const TIME_WIN=6; // seconds visible
let viewLow=48, viewHigh=84; // C3..C6 default
let audioCtx=null, analyser=null, micStream=null, micSource=null;
let pitchBuf=null;
const history=[]; // {t, midi}
let appStart=0;
let midiNotes=[], midiDuration=0;
let midiPlaying=false, midiPlayStart=0, midiOscs=[];
let isRec=false, mediaRec=null, recChunks=[], recBlob=null, recAudio=null;
let lastMidi=null;
let tracking=false; // 音程追跡中かどうか

const pCv=document.getElementById('pCv'), pCtx=pCv.getContext('2d');
const vCv=document.getElementById('vCv'), vCtx=vCv.getContext('2d');

function noteName(m){return NOTES[m%12]+(Math.floor(m/12)-1)}
function isBlack(m){return [1,3,6,8,10].includes(m%12)}
function midiToY(m,h){return (viewHigh-m)/(viewHigh-viewLow)*h}

function resize(){
  const dpr=window.devicePixelRatio||1;
  for(const [cv,ctx] of [[pCv,pCtx],[vCv,vCtx]]){
    const r=cv.parentElement.getBoundingClientRect();
    cv.width=r.width*dpr; cv.height=r.height*dpr;
    cv.style.width=r.width+'px'; cv.style.height=r.height+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  drawPiano();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,100));

// ============ Piano ============
function drawPiano(){
  const w=pCv.clientWidth, h=pCv.clientHeight;
  pCtx.fillStyle='#1a1a1a'; pCtx.fillRect(0,0,w,h);
  for(let m=viewLow;m<=viewHigh;m++){
    const y1=midiToY(m+0.5,h), y2=midiToY(m-0.5,h);
    const blk=isBlack(m);
    pCtx.fillStyle=blk?'#1a1a1a':'#e5e5e5';
    pCtx.fillRect(0,y1,w,y2-y1);
    pCtx.strokeStyle='#000'; pCtx.lineWidth=.5;
    pCtx.strokeRect(0,y1,w,y2-y1);
    if(!blk && (y2-y1)>10){
      pCtx.fillStyle='#333';
      pCtx.font='10px sans-serif';
      pCtx.textAlign='center'; pCtx.textBaseline='middle';
      pCtx.fillText(noteName(m),w/2,(y1+y2)/2);
    }
  }
}

// ============ Mic / Audio ============
async function initAudio(){
  if(audioCtx) return true;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    micStream=await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false
    }});
    micSource=audioCtx.createMediaStreamSource(micStream);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=2048;
    analyser.smoothingTimeConstant=0;
    micSource.connect(analyser);
    pitchBuf=new Float32Array(analyser.fftSize);
    document.getElementById('dot').classList.add('on');
    document.getElementById('status').textContent='検出中';
    appStart=audioCtx.currentTime;
    tracking=true;
    return true;
  }catch(e){
    document.getElementById('status').textContent='マイクが使えません';
    return false;
  }
}

// ============ YIN pitch detection ============
function detectPitch(buf,sr){
  const N=buf.length;
  // RMS
  let rms=0; for(let i=0;i<N;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/N);
  if(rms<0.008) return -1;
  
  const minF=65, maxF=1100;
  const maxLag=Math.min(N>>1, Math.floor(sr/minF));
  const minLag=Math.max(2, Math.floor(sr/maxF));
  
  // YIN difference function
  const d=new Float32Array(maxLag+1);
  for(let tau=1;tau<=maxLag;tau++){
    let s=0;
    const lim=N-maxLag;
    for(let j=0;j<lim;j++){
      const diff=buf[j]-buf[j+tau];
      s+=diff*diff;
    }
    d[tau]=s;
  }
  // Cumulative mean normalized
  const cmnd=new Float32Array(maxLag+1);
  cmnd[0]=1;
  let cum=0;
  for(let tau=1;tau<=maxLag;tau++){
    cum+=d[tau];
    cmnd[tau]=d[tau]*tau/cum;
  }
  // Find first dip below threshold
  const TH=0.15;
  let bestTau=-1;
  for(let tau=minLag;tau<maxLag;tau++){
    if(cmnd[tau]<TH){
      while(tau+1<maxLag && cmnd[tau+1]<cmnd[tau]) tau++;
      bestTau=tau; break;
    }
  }
  if(bestTau<0){
    // fallback: global minimum
    let mn=Infinity, mp=-1;
    for(let tau=minLag;tau<maxLag;tau++){
      if(cmnd[tau]<mn){mn=cmnd[tau]; mp=tau;}
    }
    if(mn<0.4) bestTau=mp; else return -1;
  }
  // Parabolic interpolation
  if(bestTau>1 && bestTau<maxLag-1){
    const x1=cmnd[bestTau-1], x2=cmnd[bestTau], x3=cmnd[bestTau+1];
    const a=(x1+x3-2*x2)/2, b=(x3-x1)/2;
    if(a!==0) bestTau=bestTau-b/(2*a);
  }
  return sr/bestTau;
}

function freqToMidi(f){return 69+12*Math.log2(f/440)}

// ============ MIDI parser ============
function parseMidi(ab){
  const dv=new DataView(ab); let p=0;
  const r8=()=>dv.getUint8(p++);
  const r16=()=>{const v=dv.getUint16(p);p+=2;return v;};
  const r32=()=>{const v=dv.getUint32(p);p+=4;return v;};
  const rStr=(n)=>{let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(r8());return s;};
  const rVar=()=>{let v=0,b;do{b=r8();v=(v<<7)|(b&0x7F);}while(b&0x80);return v;};
  
  if(rStr(4)!=='MThd') throw new Error('Not MIDI');
  r32();
  r16(); // format
  const nTracks=r16();
  const div=r16();
  const tpb=(div&0x8000)?480:div;
  
  const events=[];
  for(let t=0;t<nTracks;t++){
    if(p>=ab.byteLength) break;
    if(rStr(4)!=='MTrk') break;
    const len=r32();
    const end=p+len;
    let tick=0, status=0;
    const ons={};
    while(p<end){
      const dt=rVar(); tick+=dt;
      let s=r8();
      if(s<0x80){p--; s=status;} else status=s;
      
      if(s===0xFF){
        const mt=r8(); const ml=rVar();
        if(mt===0x51){
          const tempo=(dv.getUint8(p)<<16)|(dv.getUint8(p+1)<<8)|dv.getUint8(p+2);
          events.push({tick,type:'tempo',tempo});
        }
        p+=ml;
      }else if(s===0xF0||s===0xF7){
        p+=rVar();
      }else{
        const hi=s&0xF0;
        if(hi===0x90){
          const m=r8(), v=r8();
          if(v>0){ ons[m]={tick,vel:v}; }
          else if(ons[m]){
            events.push({type:'note',start:ons[m].tick,end:tick,midi:m,vel:ons[m].vel});
            delete ons[m];
          }
        }else if(hi===0x80){
          const m=r8(); r8();
          if(ons[m]){
            events.push({type:'note',start:ons[m].tick,end:tick,midi:m,vel:ons[m].vel});
            delete ons[m];
          }
        }else if(hi===0xC0||hi===0xD0){r8();}
        else{r8();r8();}
      }
    }
    p=end;
  }
  // Tick → seconds
  const tempos=events.filter(e=>e.type==='tempo').sort((a,b)=>a.tick-b.tick);
  function t2s(tick){
    let sec=0, lt=0, tp=500000;
    for(const e of tempos){
      if(e.tick>tick) break;
      sec+=(e.tick-lt)*tp/1e6/tpb;
      lt=e.tick; tp=e.tempo;
    }
    sec+=(tick-lt)*tp/1e6/tpb;
    return sec;
  }
  midiNotes=events.filter(e=>e.type==='note').map(e=>({
    start:t2s(e.start), end:t2s(e.end), midi:e.midi, vel:e.vel
  })).sort((a,b)=>a.start-b.start);
  midiDuration=midiNotes.reduce((m,n)=>Math.max(m,n.end),0);
}

document.getElementById('midiF').addEventListener('change',async(e)=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const ab=await f.arrayBuffer();
    parseMidi(ab);
    document.getElementById('status').textContent=`MIDI: ${midiNotes.length}音 / ${midiDuration.toFixed(1)}秒`;
    if(midiNotes.length>0){
      const lo=Math.min(...midiNotes.map(n=>n.midi));
      const hi=Math.max(...midiNotes.map(n=>n.midi));
      const c=(lo+hi)/2;
      viewLow=Math.max(21,Math.floor(c-15));
      viewHigh=Math.min(108,Math.ceil(c+15));
      drawPiano();
    }
  }catch(err){
    document.getElementById('status').textContent='MIDI読込失敗: '+err.message;
  }
});

// ============ MIDI playback ============
function startMidiPlayback(){
  if(!audioCtx||midiNotes.length===0) return;
  stopMidiPlayback();
  midiPlayStart=audioCtx.currentTime;
  midiPlaying=true;
  for(const n of midiNotes){
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type='triangle';
    o.frequency.value=440*Math.pow(2,(n.midi-69)/12);
    o.connect(g); g.connect(audioCtx.destination);
    const t0=midiPlayStart+n.start, t1=midiPlayStart+n.end;
    const vol=0.12*(n.vel/127);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.015);
    g.gain.setValueAtTime(vol,Math.max(t0+0.02,t1-0.05));
    g.gain.linearRampToValueAtTime(0,t1);
    o.start(t0); o.stop(t1+0.05);
    midiOscs.push(o);
  }
  // schedule end
  setTimeout(()=>{ midiPlaying=false; }, (midiDuration+0.5)*1000);
}
function stopMidiPlayback(){
  midiPlaying=false;
  for(const o of midiOscs){ try{o.stop();}catch(e){} }
  midiOscs=[];
}

// ============ Recording ============
document.getElementById('recBtn').addEventListener('click',async()=>{
  if(!await initAudio()) return;
  if(isRec){
    mediaRec.stop();
    document.getElementById('recBtn').classList.remove('on');
    isRec=false;
    stopMidiPlayback();
  }else{
    recChunks=[];
    try{
      mediaRec=new MediaRecorder(micStream);
    }catch(e){
      document.getElementById('status').textContent='録音非対応';return;
    }
    mediaRec.ondataavailable=(e)=>{ if(e.data.size>0) recChunks.push(e.data); };
    mediaRec.onstop=()=>{
      recBlob=new Blob(recChunks,{type:mediaRec.mimeType||'audio/webm'});
      if(recAudio){ try{recAudio.pause();}catch(e){} URL.revokeObjectURL(recAudio.src); }
      recAudio=new Audio(URL.createObjectURL(recBlob));
      document.getElementById('pbBtn').disabled=false;
      document.getElementById('status').textContent='録音完了 ♪で再生';
    };
    mediaRec.start();
    document.getElementById('recBtn').classList.add('on');
    isRec=true;
    tracking=true;
    document.getElementById('dot').classList.add('on');
    history.length=0;
    appStart=audioCtx.currentTime;
    document.getElementById('status').textContent='録音中…';
    if(midiNotes.length>0) startMidiPlayback();
  }
});

document.getElementById('playBtn').addEventListener('click',async()=>{
  if(!await initAudio()) return;
  tracking=true;
  document.getElementById('dot').classList.add('on');
  appStart=audioCtx.currentTime;
  history.length=0;
  if(midiPlaying){ stopMidiPlayback(); return; }
  if(midiNotes.length===0){
    document.getElementById('status').textContent='検出中（MIDIなし）';return;
  }
  history.length=0;
  appStart=audioCtx.currentTime;
  startMidiPlayback();
});

document.getElementById('stopBtn').addEventListener('click',()=>{
  stopMidiPlayback();
  if(isRec){ mediaRec.stop(); document.getElementById('recBtn').classList.remove('on'); isRec=false; }
  if(recAudio && !recAudio.paused){ recAudio.pause(); }
  // 音程追跡を停止
  tracking=false;
  document.getElementById('dot').classList.remove('on');
  document.getElementById('status').textContent='■ 停止中 ― ▶で再開';
  document.getElementById('note').textContent='--';
  lastMidi=null;
});

document.getElementById('pbBtn').addEventListener('click',()=>{
  if(!recAudio) return;
  if(recAudio.paused){
    recAudio.currentTime=0;
    recAudio.play();
    document.getElementById('status').textContent='録音再生中';
    if(midiNotes.length>0){
      // restart midi guide synchronized
      stopMidiPlayback();
      startMidiPlayback();
    }
  }else{
    recAudio.pause();
  }
});

// ============ Zoom ============
document.getElementById('zUp').addEventListener('click',()=>{
  const span=viewHigh-viewLow;
  if(span>12){ viewLow+=1; viewHigh-=1; drawPiano(); }
});
document.getElementById('zDn').addEventListener('click',()=>{
  const span=viewHigh-viewLow;
  if(span<60){ viewLow=Math.max(21,viewLow-1); viewHigh=Math.min(108,viewHigh+1); drawPiano(); }
});

// pan via touch on canvas
let touchStartY=null, touchStartView=null;
vCv.addEventListener('touchstart',(e)=>{
  if(e.touches.length===1){
    touchStartY=e.touches[0].clientY;
    touchStartView=[viewLow,viewHigh];
  }
},{passive:true});
vCv.addEventListener('touchmove',(e)=>{
  if(e.touches.length===1 && touchStartY!=null){
    const dy=e.touches[0].clientY-touchStartY;
    const h=vCv.clientHeight;
    const span=touchStartView[1]-touchStartView[0];
    const shift=Math.round(dy/h*span);
    const newLow=touchStartView[0]+shift;
    const newHigh=touchStartView[1]+shift;
    if(newLow>=21 && newHigh<=108){
      viewLow=newLow; viewHigh=newHigh; drawPiano();
    }
  }
},{passive:true});
vCv.addEventListener('touchend',()=>{ touchStartY=null; });

// ============ Render loop ============
function smoothMidi(m){
  // Octave correction: stick to last detected octave if jump is >7 semitones
  if(lastMidi!=null){
    const diff=m-lastMidi;
    if(diff>7) m-=12; else if(diff<-7) m+=12;
  }
  lastMidi=m;
  return m;
}

function draw(){
  if(analyser && tracking){
    analyser.getFloatTimeDomainData(pitchBuf);
    const f=detectPitch(pitchBuf, audioCtx.sampleRate);
    const now=audioCtx.currentTime;
    if(f>0){
      let m=freqToMidi(f);
      m=smoothMidi(m);
      if(m>=21 && m<=108){
        history.push({t:now, midi:m});
        document.getElementById('note').textContent=`${noteName(Math.round(m))} ${f.toFixed(1)}Hz`;
      }
    }else{
      history.push({t:now, midi:null});
      lastMidi=null;
    }
    while(history.length>0 && history[0].t<now-TIME_WIN*2) history.shift();
  }
  
  const w=vCv.clientWidth, h=vCv.clientHeight;
  vCtx.fillStyle='#0f0f0f'; vCtx.fillRect(0,0,w,h);
  
  // grid lines per semitone
  for(let m=viewLow;m<=viewHigh;m++){
    const y=midiToY(m+0.5,h);
    vCtx.strokeStyle=isBlack(m)?'#161616':'#1f1f1f';
    vCtx.lineWidth=1;
    vCtx.beginPath(); vCtx.moveTo(0,y); vCtx.lineTo(w,y); vCtx.stroke();
  }
  // C note line emphasis
  for(let m=viewLow;m<=viewHigh;m++){
    if(m%12===0){
      const y=midiToY(m,h);
      vCtx.strokeStyle='#2a2a2a';
      vCtx.beginPath(); vCtx.moveTo(0,y); vCtx.lineTo(w,y); vCtx.stroke();
    }
  }
  
  if(!audioCtx){ requestAnimationFrame(draw); return; }
  
  // Determine view window (playhead at 60% from left)
  const phRatio=0.6;
  const phX=w*phRatio;
  const now=audioCtx.currentTime;
  const viewLeft=now-(phX/w)*TIME_WIN;
  const viewRight=viewLeft+TIME_WIN;
  
  // MIDI guide bars
  if(midiNotes.length>0){
    for(const n of midiNotes){
      const ns=midiPlayStart+n.start, ne=midiPlayStart+n.end;
      if(ne<viewLeft||ns>viewRight) continue;
      if(n.midi<viewLow-1||n.midi>viewHigh+1) continue;
      const x1=(ns-viewLeft)/TIME_WIN*w;
      const x2=(ne-viewLeft)/TIME_WIN*w;
      const y1=midiToY(n.midi+0.42,h);
      const y2=midiToY(n.midi-0.42,h);
      // current note highlight
      const isCurrent=midiPlaying && now>=ns && now<=ne;
      vCtx.fillStyle=isCurrent?'#ffaa3d':'#ff7a1a';
      vCtx.fillRect(x1,y1,Math.max(1,x2-x1),y2-y1);
    }
  }
  
  // Playhead line
  vCtx.strokeStyle='rgba(74,222,128,.7)';
  vCtx.lineWidth=1;
  vCtx.beginPath(); vCtx.moveTo(phX,0); vCtx.lineTo(phX,h); vCtx.stroke();
  
  // Pitch line (white)
  vCtx.strokeStyle='#fff';
  vCtx.lineWidth=2.5;
  vCtx.lineJoin='round';
  vCtx.beginPath();
  let drawing=false, lastX=null;
  for(const p of history){
    if(p.t<viewLeft||p.t>viewRight){ drawing=false; continue; }
    if(p.midi==null){ drawing=false; continue; }
    const x=(p.t-viewLeft)/TIME_WIN*w;
    const y=midiToY(p.midi,h);
    if(!drawing){ vCtx.moveTo(x,y); drawing=true; }
    else{
      // break line if gap
      if(lastX!=null && x-lastX>w*0.04){ vCtx.moveTo(x,y); }
      else vCtx.lineTo(x,y);
    }
    lastX=x;
  }
  vCtx.stroke();
  
  requestAnimationFrame(draw);
}

resize();
requestAnimationFrame(draw);

// Resume audio context on first interaction (mobile requirement)
document.addEventListener('touchstart',()=>{
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
},{once:false, passive:true});
</script>
</body>
</html>
